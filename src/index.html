<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>xinyx射击</title>
  <link rel="manifest" href="./manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #0d121c;
      color: #dbe6f4;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    .root {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px;
      padding: 24px;
    }
    .logo {
      width: 120px; height: 120px;
      border-radius: 24px;
      background: linear-gradient(135deg, #1f3558, #0d121c);
      border: 2px solid rgba(120, 180, 255, 0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .title {
      font-size: 22px; font-weight: 700;
      letter-spacing: 4px;
      background: linear-gradient(90deg, #5fb0ff, #3d86dd);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sub {
      font-size: 13px; color: #7d8ea6;
      letter-spacing: 1px;
    }
    /* 加载动画 */
    .loader {
      width: 42px; height: 42px;
      border: 3px solid rgba(95, 176, 255, 0.2);
      border-top-color: #5fb0ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* 错误状态 */
    .error-box {
      text-align: center;
      display: none;
    }
    .error-box.show { display: block; }
    .error-title {
      font-size: 16px; color: #ff8585;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .error-sub {
      font-size: 12px; color: #7d8ea6;
      line-height: 1.6;
      margin-bottom: 18px;
      max-width: 280px;
    }
    .btn-retry {
      padding: 10px 28px;
      background: linear-gradient(180deg, #5fb0ff, #3d86dd);
      border: none; border-radius: 8px;
      color: #08111f; font-weight: 700;
      letter-spacing: 2px; font-size: 14px;
      cursor: pointer;
    }
    .btn-retry:active { transform: translateY(1px); }
    /* WebView 版本警告 */
    .warn-box {
      display: none;
      text-align: center;
    }
    .warn-box.show { display: block; }
    .warn-title {
      font-size: 15px; color: #ffcf5c;
      margin-bottom: 10px; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="root">
    <div class="logo">🎯</div>
    <div class="title">XINYX · 射击</div>
    <div class="sub">加载中, 请稍候…</div>
    <div class="loader" id="loader"></div>

    <div class="warn-box" id="warn-box">
      <div class="warn-title">⚠️ 您的系统 WebView 版本过低</div>
      <div class="error-sub">
        本游戏需要 WebView 87+ 才能正常运行 Three.js。<br/>
        请到应用商店搜索 "Android System WebView" 更新后重试。
      </div>
      <button class="btn-retry" onclick="location.reload()">我已更新, 重试</button>
    </div>

    <div class="error-box" id="error-box">
      <div class="error-title">网络连接失败</div>
      <div class="error-sub" id="error-sub">
        请检查网络连接, 或确认游戏服务器正在运行。
      </div>
      <button class="btn-retry" onclick="location.reload()">重新加载</button>
    </div>
  </div>

  <script>
    const SERVER_URL = 'http://8.134.192.185:4000';

    // ---- 1. WebView 版本检测 (Three.js r169 需要 ESM+importmap → WebView 87+) ----
    // Chromium 版本探测: 通过 User-Agent
    function getChromiumVersion() {
      const m = navigator.userAgent.match(/Chrome\/(\d+)/);
      return m ? parseInt(m[1], 10) : 0;
    }
    const chromeVer = getChromiumVersion();
    if (chromeVer && chromeVer < 87) {
      document.getElementById('loader').style.display = 'none';
      document.querySelector('.sub').style.display = 'none';
      document.querySelector('.loader').style.display = 'none';
      document.getElementById('warn-box').classList.add('show');
      console.warn('[xinyx-app] WebView Chrome version =', chromeVer, 'needs >= 87');
    } else {
      launch();
    }

    // ---- 2. 网络预热 + 跳转 ----
    let retryCount = 0;
    const MAX_RETRY = 2;

    function launch() {
      retryCount++;
      const timeout = setTimeout(() => showError('连接超时, 请检查网络或重试'), 8000);
      fetch(SERVER_URL + '/', { method: 'GET', mode: 'cors', cache: 'no-store' })
        .then((r) => {
          clearTimeout(timeout);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          // 成功: 直接跳转 (Capacitor 会在 WebView 里加载)
          location.href = SERVER_URL + '/';
        })
        .catch((e) => {
          clearTimeout(timeout);
          if (retryCount <= MAX_RETRY) {
            setTimeout(launch, 800);
          } else {
            showError('无法连接游戏服务器 (' + e.message + ')');
          }
        });
    }

    function showError(msg) {
      document.getElementById('loader').style.display = 'none';
      document.querySelector('.sub').style.display = 'none';
      document.getElementById('error-sub').textContent = msg;
      document.getElementById('error-box').classList.add('show');
    }
  </script>
</body>
</html>
