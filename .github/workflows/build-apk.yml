name: Build xinyx APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: chmod gradlew
        run: chmod +x gradlew
        working-directory: apps/xinyx-app/android

      - name: gradle assembleDebug
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/xinyx-app/android

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: xinyx-debug-apk
          path: apps/xinyx-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
