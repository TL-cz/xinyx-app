name: Build xinyx APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: build debug apk
        run: |
          sed -i 's/\r$//' gradlew
          bash gradlew assembleDebug --no-daemon
        working-directory: apps/xinyx-app/android

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: xinyx-debug-apk
          path: apps/xinyx-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
