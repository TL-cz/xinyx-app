name: Build xinyx APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - uses: android-actions/setup-android@v3

      - name: debug env
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          ls $ANDROID_HOME/platforms || echo "no platforms"

      - name: build apk
        run: |
          sed -i 's/\r$//' gradlew
          bash gradlew assembleDebug --no-daemon --stacktrace
        working-directory: apps/xinyx-app/android

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: xinyx-debug-apk
          path: apps/xinyx-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
