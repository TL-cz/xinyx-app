name: Build xinyx APK

on:
  push:
    branches: [main, master]
    paths: ['apps/xinyx-app/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/xinyx-app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu
          cache: gradle
          cache-dependency-path: apps/xinyx-app/android

      - name: Install dependencies
        run: npm ci
        working-directory: apps/xinyx-app

      - name: Add Android platform
        run: npx cap add android
        working-directory: apps/xinyx-app

      - name: Sync web assets
        run: npx cap sync
        working-directory: apps/xinyx-app

      - name: Generate debug keystore (for signing)
        run: |
          keytool -genkeypair \
            -v \
            -keystore android/app/release.keystore \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=xinyx, OU=tps, O=xinyx, L=Shanghai, ST=Shanghai, C=CN" \
            2>&1 || true
          echo "--- keystore generated ---"
        working-directory: apps/xinyx-app

      - name: Patch build.gradle with release signing
        run: |
          cat >> android/app/build.gradle <<'GRADLE_PATCH'

android {
    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "android"
            keyAlias "release"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
GRADLE_PATCH
          echo "--- build.gradle patched ---"
        working-directory: apps/xinyx-app

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/xinyx-app/android

      - name: Verify APK
        run: ls -la android/app/build/outputs/apk/release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xinyx-release-apk
          path: apps/xinyx-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
